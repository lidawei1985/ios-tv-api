name: tv-api
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时自动采集刷新（无人值守）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-api
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect & normalize (with banned-content audit gate)
        run: python tools/collect.py
      - name: Commit data
        run: |
          git config user.name "tv-engine[bot]"
          git config user.email "tv-engine[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto: refresh tv api [skip ci]"
          git push
